<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bb7c8"/>
      <stop offset="0.32" stop-color="#e8cfae"/>
      <stop offset="0.52" stop-color="#f8d9a5"/>
      <stop offset="0.62" stop-color="#f9c185"/>
      <stop offset="0.72" stop-color="#f2a066"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffe6a3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd993" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillsFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88163"/>
      <stop offset="1" stop-color="#b4553c"/>
    </linearGradient>
    <linearGradient id="hillsMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b34a37"/>
      <stop offset="1" stop-color="#8f352b"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8542f"/>
      <stop offset="0.4" stop-color="#a83a26"/>
      <stop offset="1" stop-color="#6d211d"/>
    </linearGradient>
    <linearGradient id="fieldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b267" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f7b267" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

